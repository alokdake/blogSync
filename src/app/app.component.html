<ngx-ui-loader
  fgsColor="black"
  text="Please wait..."
  pbColor="white"
></ngx-ui-loader>

<div ngxUiLoaderBlurred [blur]="7">
  <div>
    <nav
      style="font-family: cursive; font-size: larger"
      class="navbar navbar-expand-lg navbar-dark bg-dark"
    >
      <a
        routerLink="/userprofile"
        style="cursor: pointer"
        (click)="userprofile()"
        class="navbar-brand"
        >logged by <b>{{ updatedFirstName }}</b>
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-toggle="collapse"
        data-target="#navbarTogglerDemo02"
        aria-controls="navbarTogglerDemo02"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarTogglerDemo02">
        <ul class="navbar-nav mr-auto mt-2 mt-lg-0">
          <li style="cursor: pointer" class="nav-item active">
            <a routerLink="/home" class="nav-link"
              >Home <span class="sr-only">(current)</span></a
            >
          </li>
          <li style="cursor: pointer" class="nav-item active">
            <a routerLink="/category" class="nav-link"
              >Category <span class="sr-only">(current)</span></a
            >
          </li>
          <li style="cursor: pointer" class="nav-item active">
            <a (click)="create()" class="nav-link"
              >Create Blog <span class="sr-only">(current)</span></a
            >
          </li>
          <li style="cursor: pointer" class="nav-item active">
            <a (click)="admin()" class="nav-link">Admin</a>
          </li>
          <li
            *ngIf="userDetails"
            style="cursor: pointer"
            class="nav-item active"
          >
            <a (click)="logout()" class="nav-link">Log Out</a>
          </li>
        </ul>
      </div>
    </nav>
  </div>
  <router-outlet></router-outlet>
</div>
