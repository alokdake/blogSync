<div class="login-page">
  <div *ngIf="userData" class="form">
    <h2><b>Update Details</b></h2>
    <br />

    <form [formGroup]="editForm" class="Register-form">
      <div>
        <input
          [(ngModel)]="userData.firstname"
          [ngModelOptions]="{ standalone: true }"
          type="text"
          placeholder="First Name *"
          id="form3Example1cg"
          class="form-control form-control-lg"
        />
      </div>
      <div>
        <input
          [(ngModel)]="userData.lastname"
          [ngModelOptions]="{ standalone: true }"
          type="text"
          placeholder="Last Name *"
          id="form3Example1cg"
          class="form-control form-control-lg"
        />
      </div>

      <div>
        <input
          [(ngModel)]="userData.email"
          [ngModelOptions]="{ standalone: true }"
          type="text"
          class="form-control"
        />
      </div>

      <div>
        <input
          [(ngModel)]="userData.password"
          [ngModelOptions]="{ standalone: true }"
          type="password"
          placeholder="Password *"
          id="form3Example4cg"
          class="form-control form-control-lg"
        />
      </div>

      <button
        style="background-color: black"
        type="button"
        (click)="updateUser()"
      >
        Update
      </button>

      <p class="message">
        Already updated? <a href="/userprofile">My Profile</a>
      </p>
    </form>
  </div>
</div>
