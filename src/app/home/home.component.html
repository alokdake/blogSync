<span *ngIf="noResultReturned" class="loader"></span>
<br />
<div style="display: flex; justify-content: center">
  <form class="form-inline" style="width: 50%">
    <input
      (input)="searchBlogs(searchInput.value)"
      #searchInput
      class="form-control mr-sm-2"
      type="search"
      placeholder="Search"
      style="width: 100%"
    />
  </form>
</div>

<style>
  input::placeholder {
    font-weight: bold;
  }
</style>

<div class="container">
  <div
    (click)="viewBlog(blogs._id)"
    *ngFor="let blogs of allBlogs"
    class="card"
    style="display: inline-block; width: 300px; margin: 10px"
  >
    <div style="cursor: pointer" class="card-header">
      <img src="{{ blogs.imgUrl }}" alt="rover" />
    </div>
    <div class="card-body">
      <span class="tag tag-teal">{{ blogs.category }}</span>
      <h4>{{ blogs.title }}</h4>
      <div
        style="
          text-overflow: ellipsis;
          overflow: hidden;
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
          cursor: pointer;
        "
      >
        <p>
          {{ blogs.description }}
        </p>
      </div>

      <div class="user">
        <div class="user-info">
          <h5>{{ blogs.author }}</h5>
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
            "
          >
            <small>{{ blogs.createdAt | date : "medium" }}</small>
            <span
              (click)="report(blogs._id)"
              style="
                position: absolute;
                right: 0;
                cursor: pointer;
                padding-right: 10px;
              "
              ><mat-icon>report</mat-icon></span
            >
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
