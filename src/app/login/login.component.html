<span *ngIf="noResultReturned" class="loader"></span>
<div class="login-page">
  <div style="margin-top: 50%" class="form">
    <h2><b>Sign In</b></h2>
    <br />
    <form [formGroup]="loginForm" class="login-form">
      <input
        class="form-control"
        [(ngModel)]="email"
        type="text"
        formControlName="email"
        placeholder="Email"
      />
      <input
        class="form-control"
        [(ngModel)]="password"
        type="password"
        formControlName="password"
        placeholder="Password"
      />
      <button type="button" (click)="login()">Sign In</button>
      <p class="message">
        Not registered?
        <a style="cursor: pointer" (click)="register()">Create an account</a>
      </p>
    </form>
  </div>
</div>
